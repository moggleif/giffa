# Månadens skanning (K11, beslut 0003): söker igenom kommunhandlingar efter
# orterna, platserna och de öppna ärendenas diarienummer från början av förra
# rundans period och öppnar ett issue med träffarna, som rundan utgår från.
# Hela rapporten sparas som artefakt; issuet hoppas över om dagens redan finns.
name: Skanning

on:
  schedule:
    - cron: "17 5 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  skanna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Hämta årets och fjolårets handlingar ur kommunhandlingar
        run: |
          ar=$(date +%Y)
          git clone --depth 1 --filter=blob:none --no-checkout \
            https://github.com/moggleif/kommunhandlingar.git "$RUNNER_TEMP/kh"
          git -C "$RUNNER_TEMP/kh" sparse-checkout set --no-cone \
            "data/kungsbacka/*/$ar/" "data/kungsbacka/*/$((ar - 1))/"
          git -C "$RUNNER_TEMP/kh" checkout
      - name: Sök
        run: |
          python3 -m skanning "$RUNNER_TEMP/kh/data/kungsbacka" \
            https://moggleif.github.io/kommunhandlingar > "$RUNNER_TEMP/traffar.md"
      - uses: actions/upload-artifact@v4
        with:
          name: traffar
          path: ${{ runner.temp }}/traffar.md
      - name: Öppna dagens issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          titel="Underlag för bevakningsrunda: träffar till och med $(date +%F)"
          gh label create runda --force --description "Underlag för månadens bevakningsrunda"
          if gh issue list --label runda --state all --search "in:title \"$titel\"" \
            --json title --jq '.[].title' | grep -qxF "$titel"; then
            echo "Issuet finns redan: $titel"
            exit 0
          fi
          gh issue create --label runda --body-file "$RUNNER_TEMP/traffar.md" --title "$titel"
