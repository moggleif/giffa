# Bygger sidan ur ärendena och publicerar den på GitHub Pages vid varje
# ändring på main och varje morgon, så att passerade tillfällen att tycka
# till försvinner och KS-mötet visar nästa sammanträde (K3, K12, K34,
# beslut 0002, 0004 och 0012).
name: Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicera:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicering.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Hämta kommunhandlingars kod, kalender och kommunstyrelsens handlingar
        run: |
          ar=$(date +%Y)
          git clone --depth 1 --filter=blob:none --no-checkout \
            https://github.com/moggleif/kommunhandlingar.git "$RUNNER_TEMP/kh"
          git -C "$RUNNER_TEMP/kh" sparse-checkout set --no-cone "src/" "kalender/" \
            "data/kungsbacka/ks/$ar/" "data/kungsbacka/ks/$((ar + 1))/" "!*.tabeller/"
          git -C "$RUNNER_TEMP/kh" checkout
          echo "PYTHONPATH=$RUNNER_TEMP/kh/src" >> "$GITHUB_ENV"
          pip install markdown-it-py==4.2.0
      - name: Bygg sidan
        run: python3 -m webbplats _site "${{ github.server_url }}/${{ github.repository }}" "$RUNNER_TEMP/kh"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: publicering
        uses: actions/deploy-pages@v5
