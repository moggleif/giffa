# Bygger sidan ur ärendena och publicerar den på GitHub Pages vid varje
# ändring på main och varje morgon, så att passerade tillfällen att tycka
# till försvinner (K3, K12, beslut 0002 och 0004).
name: Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicera:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicering.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v5
      - name: Bygg sidan
        run: python3 -m webbplats _site "${{ github.server_url }}/${{ github.repository }}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: publicering
        uses: actions/deploy-pages@v4
