# Veckans kallelser (K13, K39, beslut 0005 och 0019): söker igenom kommunens
# och regionens kallelser och handlingar till kommande sammanträden efter
# orterna, platserna och de öppna ärendenas diarienummer – i regionens också
# efter kommunens namn – och öppnar ett issue per källa när något träffar, så
# att tillfällen att tycka till hinner föras in före mötet. Issuet hoppas över
# om veckans finns.
name: Kallelser

on:
  schedule:
    - cron: "47 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  kallelser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - kalla: kungsbackakommun
            data: data/kungsbacka
            flaggor: ""
          - kalla: regionhalland
            data: data/regionhalland
            flaggor: --kommunnamn Kungsbacka --kommunnamn Kungsbackas
    steps:
      - uses: actions/checkout@v7
      - name: Hämta årets och nästa års handlingar ur ${{ matrix.kalla }}
        run: |
          ar=$(date +%Y)
          git clone --depth 1 --filter=blob:none --no-checkout \
            "https://github.com/moggleif/${{ matrix.kalla }}.git" "$RUNNER_TEMP/kalla"
          git -C "$RUNNER_TEMP/kalla" sparse-checkout set --no-cone \
            "${{ matrix.data }}/*/$ar/" "${{ matrix.data }}/*/$((ar + 1))/"
          git -C "$RUNNER_TEMP/kalla" checkout
      - name: Sök
        run: |
          python3 -m skanning --kommande ${{ matrix.flaggor }} \
            "$RUNNER_TEMP/kalla/${{ matrix.data }}" \
            "https://moggleif.github.io/${{ matrix.kalla }}" > "$RUNNER_TEMP/kallelser.md"
      - uses: actions/upload-artifact@v7
        with:
          name: kallelser-${{ matrix.kalla }}
          path: ${{ runner.temp }}/kallelser.md
      - name: Öppna veckans issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if grep -qxF "Inga träffar." "$RUNNER_TEMP/kallelser.md"; then
            echo "Inga träffar i kommande sammanträden."
            exit 0
          fi
          titel="Kallelser i ${{ matrix.kalla }} till kommande sammanträden, vecka $(date +%G-W%V)"
          gh label create kallelser --force --description "Veckans kallelser: tillfällen att tycka till"
          if gh issue list --label kallelser --state all --search "in:title \"$titel\"" \
            --json title --jq '.[].title' | grep -qxF "$titel"; then
            echo "Issuet finns redan: $titel"
            exit 0
          fi
          gh issue create --label kallelser --body-file "$RUNNER_TEMP/kallelser.md" --title "$titel"
