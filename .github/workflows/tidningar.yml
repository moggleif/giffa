# Tidningarnas flöden varje morgon (K37, beslut 0016): läser Norra Hallands
# och SVT Hallands RSS-flöden, väljer artiklarna som nämner en ort, en plats
# eller ett uppmärksammat namn och något kommunen beslutar om, och för in de
# som inget ärende länkar i veckans issue med etiketten tidningar. Flödena
# visar bara de senaste artiklarna, så de läses varje dag; söndagsrundan
# sorterar issuet till ärendena.
name: Tidningar

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  tidningar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Hitta veckans issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          titel="Tidningsartiklar vecka $(date +%G-W%V)"
          gh label create tidningar --force --description "Tidningsartiklar att föra in i ärendena"
          nummer=$(gh issue list --label tidningar --state all --search "in:title \"$titel\"" \
            --json number,title --jq ".[] | select(.title == \"$titel\") | .number")
          touch "$RUNNER_TEMP/redan.txt"
          if [ -n "$nummer" ]; then
            gh issue view "$nummer" --json body,comments --jq '.body, .comments[].body' \
              > "$RUNNER_TEMP/redan.txt"
          fi
          echo "titel=$titel" >> "$GITHUB_ENV"
          echo "nummer=$nummer" >> "$GITHUB_ENV"
      - name: Läs flödena
        run: python3 -m tidningar "$RUNNER_TEMP/redan.txt" | tee "$RUNNER_TEMP/tidningar.md"
      - name: För in i veckans issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if head -n 1 "$RUNNER_TEMP/tidningar.md" | grep -qxF "Inga nya träffar."; then
            echo "Inga nya artiklar."
            exit 0
          fi
          if [ -n "$nummer" ]; then
            gh issue comment "$nummer" --body-file "$RUNNER_TEMP/tidningar.md"
          else
            gh issue create --label tidningar --title "$titel" --body-file "$RUNNER_TEMP/tidningar.md"
          fi
